<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F6F2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15191D" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/images/hero-executive-office.jpg" fetchpriority="high" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem("lucomi-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <style>
      #initial-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;background:#f7f6f2;color:#17324d;opacity:1;animation:lucomi-loader-hide 1.1s ease-out forwards}
      #initial-loader .loader-inner{text-align:center}
      #initial-loader .loader-mark{width:48px;height:48px;margin:0 auto 16px;border:2px solid rgba(21,96,232,.18);border-top-color:#24557d;border-radius:50%;animation:lucomi-spin .7s linear infinite}
      #initial-loader .loader-text{font:600 11px/1.4 Arial,sans-serif;letter-spacing:.22em}
      @keyframes lucomi-spin{to{transform:rotate(360deg)}}
      @keyframes lucomi-loader-hide{0%,65%{opacity:1}100%{opacity:0;visibility:hidden}}
      @media(prefers-reduced-motion:reduce){#initial-loader{animation:none;opacity:0;visibility:hidden}.loader-mark{animation:none}}
    </style>
    <title>LUCOMI ENTERPRISE — Quality Office Furniture, Better Workspaces</title>
    <meta name="description" content="LUCOMI ENTERPRISE designs and manufactures professional office furniture — executive desks, workstations, conference tables, reception desks, office chairs and storage. Custom furniture and complete workspace projects in Port Harcourt, Nigeria." />
    <meta name="keywords" content="office furniture Nigeria, executive desk, workstation, conference table, reception desk, office chair, filing cabinet, custom office furniture, Port Harcourt" />
    <link rel="canonical" href="https://lucomi.name.ng/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LUCOMI ENTERPRISE" />
    <meta property="og:title" content="LUCOMI ENTERPRISE — Crafting Better Workspaces." />
    <meta property="og:description" content="Quality office furniture designed, manufactured and built for the way you work." />
    <meta property="og:url" content="https://lucomi.name.ng/" />
    <meta property="og:image" content="https://lucomi.name.ng/images/hero-executive-office.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context":"https://schema.org",
        "@type":"FurnitureStore",
        "name":"LUCOMI ENTERPRISE",

      }
    </script>
